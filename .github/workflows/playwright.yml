name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - select
          - dev
          - qa
          - stage
          - prod
      grep:
        description: "Optional tag (e.g. @sanity)"
        required: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ github.event.inputs.environment }}
      GREP: ${{ github.event.inputs.grep }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate environment selection
        run: |
          if [ "$TEST_ENV" = "select" ]; then
            echo "You must select a valid environment"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          echo "Running on ENV=$TEST_ENV"

          if [ -n "$GREP" ]; then
            echo "Filtering with grep=$GREP"
            npx playwright test --grep "$GREP"
          else
            npx playwright test
          fi

      # 🔧 FIXED: short-lived artifacts (not 30 days garbage)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ env.TEST_ENV }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3

      # 🔧 ADDED: persistent report system (last 10 runs)

      - name: Checkout gh-pages
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy report
        if: always()
        run: |
          mkdir -p gh-pages/reports/run-${{ github.run_number }}
          cp -r playwright-report/* gh-pages/reports/run-${{ github.run_number }}/

      - name: Keep only last 10 runs
        if: always()
        run: |
          cd gh-pages/reports
          ls -dt run-* | tail -n +11 | xargs rm -rf || true

      - name: Push reports
        if: always()
        run: |
          cd gh-pages
          git config user.name "ci"
          git config user.email "ci@example.com"
          git add .
          git commit -m "run-${{ github.run_number }}" || echo "no changes"
          git push