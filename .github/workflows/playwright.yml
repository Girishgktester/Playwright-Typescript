name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - select
          - dev
          - qa
          - stage
          - prod
      grep:
        description: "Optional tag (e.g. @sanity)"
        required: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ github.event.inputs.environment }}
      GREP: ${{ github.event.inputs.grep }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate environment selection
        run: |
          if [ "$TEST_ENV" = "select" ]; then
            echo "You must select a valid environment"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          echo "Running on ENV=$TEST_ENV"

          if [ -n "$GREP" ]; then
            echo "Filtering with grep=$GREP"
            npx playwright test --grep "$GREP"
          else
            npx playwright test
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ env.TEST_ENV }}
          path: playwright-report/
          retention-days: 30