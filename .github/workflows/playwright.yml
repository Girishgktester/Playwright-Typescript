name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - select
          - dev
          - qa
          - stage
          - prod
      grep:
        description: "Optional tag (e.g. @sanity)"
        required: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    permissions:
      contents: write

    env:
      TEST_ENV: ${{ github.event.inputs.environment }}
      GREP: ${{ github.event.inputs.grep }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Validate environment selection
        run: |
          if [ "$TEST_ENV" = "select" ]; then
            echo "You must select a valid environment"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ✅ Run with blob reporter (IMPORTANT)
      - name: Run Playwright tests
        run: |
          echo "Running on ENV=$TEST_ENV"
          echo "Shard ${{ matrix.shard }}/3"

          if [ -n "$GREP" ]; then
            npx playwright test --grep "$GREP" --shard=${{ matrix.shard }}/3 --reporter=blob
          else
            npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob
          fi

      # ✅ Upload blob reports (NOT HTML)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  # ✅ NEW JOB: Merge reports
  merge-reports:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports

      - name: Merge into HTML report
        run: |
          npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 3